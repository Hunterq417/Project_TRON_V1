<!doctype html>
<!-- The cross-origin player frame: a video and its own icon-only "Next episode" control. -->
<html><head><meta charset="utf-8"><title>player</title></head><body style="margin:0">
<div class="plyr" aria-label="Video Player" style="width:620px;height:340px">
  <video src="/clip.webm" muted loop autoplay style="width:100%;height:90%"></video>
  <div class="plyr__controls">
    <button class="plyr__control" data-plyr="next" aria-label="Next episode"><svg width="12" height="12"></svg></button>
  </div>
</div>
<script>
document.querySelector('[data-plyr="next"]').addEventListener('click', () => parent.postMessage({go: 1}, '*'));
</script></body></html>
