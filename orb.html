<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background: transparent; overflow: hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<script src="vendor/three.min.js"></script>
<script>
const STATE_COLORS = {
  idle:      0xebebeb,
  listening: 0x4285f4,
  thinking:  0xffc107,
  speaking:  0x34c759,
  acting:    0x9b59b6,
  error:     0xdc3545,
};
let currentState = 'idle';
function setState(name) { if (STATE_COLORS[name] !== undefined) currentState = name; }

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.1, 4.2);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// A soft white radial-gradient sprite, used (tinted per-material) for the
// glow core, the vignette, and every ring particle. Untextured THREE.Points
// render as hard squares in WebGL — this is what makes particles read as
// soft glowing dots instead.
function makeGlowTexture() {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.35, 'rgba(255,255,255,0.7)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTexture();

// A plain (non-additive) dark radial sprite behind everything, so the orb
// has some contact/contrast against a bright desktop instead of floating
// with nothing grounding it.
function makeVignetteTexture() {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, 'rgba(0,0,0,0.55)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const vignette = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeVignetteTexture(), transparent: true, opacity: 0.5, depthWrite: false,
}));
vignette.scale.set(4.2, 4.2, 1);
scene.add(vignette);

// --- core: layered glow sprites (camera-facing, so it always looks like a glow) ---
const coreOuter = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: STATE_COLORS.idle, transparent: true, opacity: 0.5,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
coreOuter.scale.set(0.9, 0.9, 1);
scene.add(coreOuter);

const coreInner = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0xffffff, transparent: true, opacity: 1,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
coreInner.scale.set(0.34, 0.34, 1);
scene.add(coreInner);

// --- radiating spikes: fewer, brighter near the core, fainter toward the tip ---
const SPIKE_COUNT = 14;
const spikeGroup = new THREE.Group();
const spikeLines = [];
for (let i = 0; i < SPIKE_COUNT; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const len = 0.7 + Math.random() * 1.1;
  const x = Math.sin(phi) * Math.cos(theta) * len;
  const y = Math.sin(phi) * Math.sin(theta) * len;
  const z = Math.cos(phi) * len;
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0), new THREE.Vector3(x, y, z),
  ]);
  const mat = new THREE.LineBasicMaterial({
    color: STATE_COLORS.idle, transparent: true,
    opacity: 0.7 - (len - 0.7) * 0.35, // shorter spikes sit brighter, closer to the core
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const line = new THREE.Line(geo, mat);
  spikeGroup.add(line);
  spikeLines.push(mat);
}
scene.add(spikeGroup);

// --- particle ring: a real 3D ring, tilted by rotating the group ---
const RING_COUNT = 220;
const ringPositions = new Float32Array(RING_COUNT * 3);
for (let i = 0; i < RING_COUNT; i++) {
  const a = (i / RING_COUNT) * Math.PI * 2 + (Math.random() - 0.5) * 0.08;
  const rad = 1.55 + (Math.random() - 0.5) * 0.22;
  ringPositions[i * 3 + 0] = Math.cos(a) * rad;
  ringPositions[i * 3 + 1] = (Math.random() - 0.5) * 0.06;
  ringPositions[i * 3 + 2] = Math.sin(a) * rad;
}
const ringGeo = new THREE.BufferGeometry();
ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
const ringMat = new THREE.PointsMaterial({
  map: glowTex, color: STATE_COLORS.idle, size: 0.09, transparent: true, opacity: 0.9,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
});
const ring = new THREE.Points(ringGeo, ringMat);
ring.rotation.x = Math.PI / 2.6; // tilt the ring plane toward the camera
scene.add(ring);

function setColor(hex) {
  coreOuter.material.color.setHex(hex);
  spikeLines.forEach(m => m.color.setHex(hex));
  ringMat.color.setHex(hex);
}

function animate() {
  requestAnimationFrame(animate);

  setColor(STATE_COLORS[currentState]);

  const speedMul = currentState === 'idle' ? 0.3 : currentState === 'error' ? 2.4 : 1;
  const pulse = (currentState === 'speaking' || currentState === 'acting')
    ? 1 + 0.12 * Math.sin(Date.now() / 140)
    : 1;
  const wobble = Math.sin(Date.now() / 1800) * 0.06; // gentle idle drift, not mechanical spin

  ring.rotation.z += 0.006 * speedMul;
  ring.rotation.x = Math.PI / 2.6 + wobble;
  spikeGroup.rotation.y += 0.003 * speedMul;
  spikeGroup.rotation.x += 0.0015 * speedMul;

  coreInner.scale.setScalar(0.34 * pulse);
  coreOuter.scale.setScalar(0.9 * pulse * (1 + 0.05 * Math.sin(Date.now() / 300)));

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
