<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background: transparent; overflow: hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<script src="vendor/three.min.js"></script>
<script>
// State still drives feedback (halo tint + shimmer energy), but the
// particle bust itself stays white/cool-blue always — matching the
// reference image, which is monochrome.
const STATE_TINTS = {
  idle:      0x4a5568,
  listening: 0x4285f4,
  thinking:  0xffc107,
  speaking:  0x34c759,
  acting:    0x9b59b6,
  error:     0xdc3545,
};
let currentState = 'idle';
function setState(name) { if (STATE_TINTS[name] !== undefined) currentState = name; }

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.05, 3.6);
camera.lookAt(0, 0.05, 0);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function makeGlowTexture() {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.4, 'rgba(255,255,255,0.55)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTexture();

// Soft colored halo behind the bust — the main carrier of state feedback,
// so the particle cloud itself can stay true to the reference's monochrome look.
function makeVignetteTexture() {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, 'rgba(255,255,255,0.5)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeVignetteTexture(), color: STATE_TINTS.idle, transparent: true,
  opacity: 0.16, blending: THREE.AdditiveBlending, depthWrite: false,
}));
halo.position.set(0, 0, -0.4);
halo.scale.set(3.2, 3.2, 1);
scene.add(halo);

// --- bust profile: a silhouette curve revolved around the vertical axis ---
// [y (height), r (radius at that height)], top of head to bottom of shoulders.
const PROFILE = [
  { y: 1.02, r: 0.02 },
  { y: 0.92, r: 0.28 },
  { y: 0.78, r: 0.42 },
  { y: 0.55, r: 0.47 },
  { y: 0.30, r: 0.45 },
  { y: 0.10, r: 0.38 },
  { y: -0.05, r: 0.27 },
  { y: -0.18, r: 0.17 },
  { y: -0.30, r: 0.15 },
  { y: -0.55, r: 0.17 },
  { y: -0.70, r: 0.45 },
  { y: -0.95, r: 0.95 },
  { y: -1.15, r: 1.05 },
];
const Y_TOP = PROFILE[0].y;
const Y_BOTTOM = PROFILE[PROFILE.length - 1].y;

function radiusAt(y) {
  if (y >= PROFILE[0].y) return PROFILE[0].r;
  if (y <= Y_BOTTOM) return PROFILE[PROFILE.length - 1].r;
  for (let i = 0; i < PROFILE.length - 1; i++) {
    const a = PROFILE[i], b = PROFILE[i + 1];
    if (y <= a.y && y >= b.y) {
      const t = (a.y - y) / (a.y - b.y);
      const s = t * t * (3 - 2 * t); // smoothstep
      return a.r + (b.r - a.r) * s;
    }
  }
  return 0.3;
}

const Z_SQUASH = 0.82; // front-back compression, so a turned view reads correctly

function buildParticles(count, { shell, size, brightnessMin, brightnessMax }) {
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const phases = new Float32Array(count);
  const baseBrightness = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const y = Y_BOTTOM + Math.random() * (Y_TOP - Y_BOTTOM);
    const R = radiusAt(y);
    const theta = Math.random() * Math.PI * 2;
    const radius = shell ? R * (0.88 + Math.random() * 0.18) : R * Math.random() * 0.78;

    positions[i * 3 + 0] = Math.cos(theta) * radius;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = Math.sin(theta) * radius * Z_SQUASH;

    const b = brightnessMin + Math.random() * (brightnessMax - brightnessMin);
    baseBrightness[i] = b;
    // cool white-blue, matching the reference's monochrome dust
    colors[i * 3 + 0] = b * 0.86;
    colors[i * 3 + 1] = b * 0.93;
    colors[i * 3 + 2] = b;

    phases[i] = Math.random() * Math.PI * 2;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    map: glowTex, size, vertexColors: true, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  });

  const points = new THREE.Points(geo, mat);
  return { points, colors, phases, baseBrightness };
}

const shellSystem = buildParticles(3200, { shell: true, size: 0.024, brightnessMin: 0.55, brightnessMax: 1.0 });
const starSystem = buildParticles(500, { shell: false, size: 0.016, brightnessMin: 0.25, brightnessMax: 0.7 });

const bust = new THREE.Group();
bust.add(shellSystem.points, starSystem.points);
bust.rotation.y = 0.32; // turned slightly, like the reference — a portrait, not a front-on mugshot
scene.add(bust);

function twinkle(system, t, speedMul) {
  const { colors, phases, baseBrightness, points } = system;
  const count = baseBrightness.length;
  for (let i = 0; i < count; i++) {
    const flicker = 0.75 + 0.25 * Math.sin(t * 1.6 * speedMul + phases[i]);
    const b = baseBrightness[i] * flicker;
    colors[i * 3 + 0] = b * 0.86;
    colors[i * 3 + 1] = b * 0.93;
    colors[i * 3 + 2] = b;
  }
  points.geometry.attributes.color.needsUpdate = true;
}

const clockStart = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const t = (performance.now() - clockStart) / 1000;

  halo.material.color.setHex(STATE_TINTS[currentState]);
  const speedMul = currentState === 'idle' ? 0.5 : currentState === 'error' ? 2.2 : 1.15;
  const haloPulse = (currentState === 'speaking' || currentState === 'acting')
    ? 1 + 0.15 * Math.sin(t * 6)
    : 1;

  twinkle(shellSystem, t, speedMul);
  twinkle(starSystem, t, speedMul * 0.8);

  bust.rotation.y = 0.32 + Math.sin(t * 0.25) * 0.05; // gentle idle drift, not a spin
  halo.scale.setScalar(3.2 * haloPulse);

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
