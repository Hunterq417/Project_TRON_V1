<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background: transparent; overflow: hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<script src="vendor/three.min.js"></script>
<script>
// State still drives feedback (halo tint + shimmer energy), but the
// particle sphere itself stays white/cool-blue always.
const STATE_TINTS = {
  idle:      0x4a5568,
  listening: 0x4285f4,
  thinking:  0xffc107,
  speaking:  0x34c759,
  acting:    0x9b59b6,
  error:     0xdc3545,
};
let currentState = 'idle';
function setState(name) { if (STATE_TINTS[name] !== undefined) currentState = name; }

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.05, 3.6);
camera.lookAt(0, 0.05, 0);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function makeGlowTexture() {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.4, 'rgba(255,255,255,0.55)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTexture();

// Soft colored halo behind the sphere — the main carrier of state feedback,
// so the particle cloud itself can stay a consistent white/cool-blue.
function makeVignetteTexture() {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, 'rgba(255,255,255,0.5)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeVignetteTexture(), color: STATE_TINTS.idle, transparent: true,
  opacity: 0.16, blending: THREE.AdditiveBlending, depthWrite: false,
}));
halo.position.set(0, 0, -0.4);
halo.scale.set(3.2, 3.2, 1);
scene.add(halo);

// --- a true 3D sphere of particles: a dense outer shell + a sparser inner starfield ---
const SPHERE_RADIUS = 0.85;

function buildParticles(count, { shell, size, brightnessMin, brightnessMax }) {
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const phases = new Float32Array(count);
  const baseBrightness = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    // Uniform distribution over a sphere's surface (u,v -> theta,phi).
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    // Shell particles sit in a thin band around the surface; interior "stars"
    // fill the volume (cube-root so density stays uniform, not center-clumped).
    const radius = shell
      ? SPHERE_RADIUS * (0.9 + Math.random() * 0.14)
      : SPHERE_RADIUS * Math.cbrt(Math.random()) * 0.82;

    positions[i * 3 + 0] = radius * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = radius * Math.cos(phi);

    const b = brightnessMin + Math.random() * (brightnessMax - brightnessMin);
    baseBrightness[i] = b;
    // cool white-blue dust, kept from the reference look
    colors[i * 3 + 0] = b * 0.86;
    colors[i * 3 + 1] = b * 0.93;
    colors[i * 3 + 2] = b;

    phases[i] = Math.random() * Math.PI * 2;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    map: glowTex, size, vertexColors: true, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  });

  const points = new THREE.Points(geo, mat);
  return { points, colors, phases, baseBrightness };
}

const shellSystem = buildParticles(3200, { shell: true, size: 0.024, brightnessMin: 0.55, brightnessMax: 1.0 });
const starSystem = buildParticles(500, { shell: false, size: 0.016, brightnessMin: 0.25, brightnessMax: 0.7 });

const sphereGroup = new THREE.Group();
sphereGroup.add(shellSystem.points, starSystem.points);
scene.add(sphereGroup);

function twinkle(system, t, speedMul) {
  const { colors, phases, baseBrightness, points } = system;
  const count = baseBrightness.length;
  for (let i = 0; i < count; i++) {
    const flicker = 0.75 + 0.25 * Math.sin(t * 1.6 * speedMul + phases[i]);
    const b = baseBrightness[i] * flicker;
    colors[i * 3 + 0] = b * 0.86;
    colors[i * 3 + 1] = b * 0.93;
    colors[i * 3 + 2] = b;
  }
  points.geometry.attributes.color.needsUpdate = true;
}

// --- audio-reactive pulse while speaking: driven by the actual loudness of
// each chunk of TRON's voice as it plays (pushed from Python via
// setAudioLevel), not a guessed timer. Smoothed like a VU meter — fast
// attack so it feels responsive, slow release so it breathes rather than
// flickering between chunks.
let audioLevel = 0;
let smoothedLevel = 0;
function setAudioLevel(level) { audioLevel = Math.max(0, Math.min(1, level)); }

const clockStart = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const t = (performance.now() - clockStart) / 1000;

  halo.material.color.setHex(STATE_TINTS[currentState]);
  const speedMul = currentState === 'idle' ? 0.5 : currentState === 'error' ? 2.2 : 1.15;

  const targetLevel = currentState === 'speaking' ? audioLevel : 0;
  const rate = targetLevel > smoothedLevel ? 0.35 : 0.06; // fast attack, slow release
  smoothedLevel += (targetLevel - smoothedLevel) * rate;
  const speakPulse = 1 + smoothedLevel * 0.22;

  // 'acting' has no audio to follow — a gentle steady pulse stands in for it.
  const actingPulse = currentState === 'acting' ? 1 + 0.1 * Math.sin(t * 3) : 1;
  const pop = speakPulse * actingPulse;

  twinkle(shellSystem, t, speedMul);
  twinkle(starSystem, t, speedMul * 0.8);

  sphereGroup.rotation.y = t * 0.15 * speedMul; // slow continuous turn — sells the sphere's depth
  sphereGroup.rotation.x = Math.sin(t * 0.2) * 0.08; // gentle wobble on the other axis
  sphereGroup.scale.setScalar(pop);
  halo.scale.setScalar(3.2 * pop);

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
