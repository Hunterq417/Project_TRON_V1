<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background: transparent; overflow: hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const STATE_COLORS = {
  idle:      [235,235,235],
  listening: [66,133,244],
  thinking:  [255,193,7],
  speaking:  [52,199,89],
  acting:    [155,89,182],
  error:     [220,53,69],
};
let currentState = 'idle';
function setState(name) { if (STATE_COLORS[name]) currentState = name; }

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// Particle ring: distributed around a tilted ellipse (like a Saturn-ring /
// atom-orbit), each with its own angle, radius jitter, and drift speed.
const RING_COUNT = 140;
const ringParticles = [];
for (let i = 0; i < RING_COUNT; i++) {
  ringParticles.push({
    angle: (i / RING_COUNT) * Math.PI * 2 + (Math.random() - 0.5) * 0.15,
    radiusJitter: 0.85 + Math.random() * 0.3,
    speed: 0.15 + Math.random() * 0.1,
    size: 0.6 + Math.random() * 1.4,
  });
}

// Radiating spikes: a starburst of lines from the core, each its own length/width.
const SPIKE_COUNT = 18;
const spikes = [];
for (let i = 0; i < SPIKE_COUNT; i++) {
  spikes.push({
    angle: (i / SPIKE_COUNT) * Math.PI * 2,
    lengthMul: 0.6 + Math.random() * 0.9,
    width: 0.6 + Math.random() * 1.2,
  });
}

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  const w = canvas.width, h = canvas.height;
  if (!w || !h) return;
  ctx.clearRect(0, 0, w, h);

  const [r, g, b] = STATE_COLORS[currentState];
  const cx = w / 2, cy = h / 2;
  const coreRadius = Math.min(w, h) * 0.06;
  const ringRadius = Math.min(w, h) * 0.32;
  const tiltY = 0.42; // vertical squash for the tilted-ellipse look

  const speedMul = currentState === 'idle' ? 0.35 : currentState === 'error' ? 2.2 : 1;
  const pulse = (currentState === 'speaking' || currentState === 'acting')
    ? 1 + 0.12 * Math.sin(Date.now() / 140)
    : 1;

  t += 0.01 * speedMul;

  // Soft ambient glow behind everything.
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, ringRadius * 1.3);
  glow.addColorStop(0, `rgba(${r},${g},${b},0.35)`);
  glow.addColorStop(1, `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);

  // Radiating spikes, slow independent rotation.
  for (const s of spikes) {
    const a = s.angle + t * 0.6;
    const len = ringRadius * s.lengthMul * pulse;
    const x2 = cx + Math.cos(a) * len;
    const y2 = cy + Math.sin(a) * len * tiltY;
    const grad = ctx.createLinearGradient(cx, cy, x2, y2);
    grad.addColorStop(0, `rgba(255,255,255,0.9)`);
    grad.addColorStop(0.15, `rgba(${r},${g},${b},0.8)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = s.width;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  // Tilted elliptical particle ring, rotating around the core.
  const sorted = ringParticles.map(p => {
    const a = p.angle + t * p.speed;
    const rad = ringRadius * p.radiusJitter;
    const x = cx + Math.cos(a) * rad;
    const y = cy + Math.sin(a) * rad * tiltY;
    const depth = Math.sin(a); // -1 (front) .. 1 (back)
    return { x, y, size: p.size, depth };
  }).sort((p1, p2) => p1.depth - p2.depth);

  for (const p of sorted) {
    const alpha = 0.35 + 0.5 * ((p.depth + 1) / 2);
    const size = p.size * (0.8 + 0.5 * ((p.depth + 1) / 2)) * pulse;
    ctx.beginPath();
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.shadowColor = `rgba(${r},${g},${b},0.9)`;
    ctx.shadowBlur = 6;
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // Bright core: white-hot center fading into the state color.
  const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius * pulse);
  coreGrad.addColorStop(0, `rgba(255,255,255,1)`);
  coreGrad.addColorStop(0.4, `rgba(${r},${g},${b},1)`);
  coreGrad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  ctx.beginPath();
  ctx.fillStyle = coreGrad;
  ctx.arc(cx, cy, coreRadius * pulse, 0, Math.PI * 2);
  ctx.fill();
}
animate();
</script>
</body>
</html>
