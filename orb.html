<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background: transparent; overflow: hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<script src="vendor/three.min.js"></script>
<script>
const STATE_COLORS = {
  idle:      0xebebeb,
  listening: 0x4285f4,
  thinking:  0xffc107,
  speaking:  0x34c759,
  acting:    0x9b59b6,
  error:     0xdc3545,
};
let currentState = 'idle';
function setState(name) { if (STATE_COLORS[name] !== undefined) currentState = name; }

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.1, 4.2);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- core: bright sphere + soft additive glow shell ---
const coreGeo = new THREE.SphereGeometry(0.16, 24, 24);
const coreMat = new THREE.MeshBasicMaterial({ color: STATE_COLORS.idle });
const core = new THREE.Mesh(coreGeo, coreMat);
scene.add(core);

const glowGeo = new THREE.SphereGeometry(0.4, 24, 24);
const glowMat = new THREE.MeshBasicMaterial({
  color: STATE_COLORS.idle, transparent: true, opacity: 0.25,
  blending: THREE.AdditiveBlending, depthWrite: false,
});
const glow = new THREE.Mesh(glowGeo, glowMat);
scene.add(glow);

// --- radiating spikes: real 3D directions, not a flat starburst ---
const SPIKE_COUNT = 22;
const spikeGroup = new THREE.Group();
const spikeMat = new THREE.LineBasicMaterial({
  color: STATE_COLORS.idle, transparent: true, opacity: 0.55,
  blending: THREE.AdditiveBlending, depthWrite: false,
});
for (let i = 0; i < SPIKE_COUNT; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const len = 0.9 + Math.random() * 1.1;
  const x = Math.sin(phi) * Math.cos(theta) * len;
  const y = Math.sin(phi) * Math.sin(theta) * len;
  const z = Math.cos(phi) * len;
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0), new THREE.Vector3(x, y, z),
  ]);
  spikeGroup.add(new THREE.Line(geo, spikeMat));
}
scene.add(spikeGroup);

// --- particle ring: a real 3D ring, tilted by rotating the group ---
const RING_COUNT = 260;
const ringPositions = new Float32Array(RING_COUNT * 3);
for (let i = 0; i < RING_COUNT; i++) {
  const a = (i / RING_COUNT) * Math.PI * 2 + (Math.random() - 0.5) * 0.08;
  const rad = 1.6 + (Math.random() - 0.5) * 0.25;
  ringPositions[i * 3 + 0] = Math.cos(a) * rad;
  ringPositions[i * 3 + 1] = (Math.random() - 0.5) * 0.06;
  ringPositions[i * 3 + 2] = Math.sin(a) * rad;
}
const ringGeo = new THREE.BufferGeometry();
ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
const ringMat = new THREE.PointsMaterial({
  color: STATE_COLORS.idle, size: 0.045, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false,
});
const ring = new THREE.Points(ringGeo, ringMat);
ring.rotation.x = Math.PI / 2.6; // tilt the ring plane toward the camera
scene.add(ring);

function setColor(hex) {
  core.material.color.setHex(hex);
  glow.material.color.setHex(hex);
  spikeMat.color.setHex(hex);
  ringMat.color.setHex(hex);
}

function animate() {
  requestAnimationFrame(animate);

  setColor(STATE_COLORS[currentState]);

  const speedMul = currentState === 'idle' ? 0.3 : currentState === 'error' ? 2.4 : 1;
  const pulse = (currentState === 'speaking' || currentState === 'acting')
    ? 1 + 0.1 * Math.sin(Date.now() / 140)
    : 1;

  ring.rotation.z += 0.006 * speedMul;
  spikeGroup.rotation.y += 0.003 * speedMul;
  spikeGroup.rotation.x += 0.0015 * speedMul;

  core.scale.setScalar(pulse);
  glow.scale.setScalar(pulse * (1 + 0.05 * Math.sin(Date.now() / 300)));

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
